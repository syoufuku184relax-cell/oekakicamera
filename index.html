<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>特典会チェキアプリ（全画面・ピンク追加版）</title>
  <style>
    body { text-align: center; background: #111; color: white; font-family: sans-serif; margin: 0; padding: 0; touch-action: manipulation; overflow: hidden; }
    .screen { display: none; height: 100vh; box-sizing: border-box; padding: 5px 0; }
    .screen.active { display: flex; flex-direction: column; align-items: center; justify-content: center; }
    
    /* チェキ風ファインダー 3:4 比率 */
    .viewfinder-container {
      position: relative;
      display: inline-block;
      background: white;
      padding: 10px 10px 40px 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      border-radius: 6px;
    }
    video {
      width: 80vw;
      max-width: 340px;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      background: #000;
      display: block;
    }

    /* スマホ全画面に近いサイズまで限界まで大きく表示 (3:4保持) */
    #previewImg, #chekiCanvas {
      width: auto;
      height: auto;
      max-width: 92vw;
      max-height: 85vh;
      aspect-ratio: 3 / 4;
      border-radius: 6px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.8);
      background: white;
      object-fit: contain;
    }

    button { padding: 8px 16px; font-size: 13px; margin: 3px; cursor: pointer; border: none; border-radius: 20px; font-weight: bold; }
    .btn-main { background: #ff4081; color: white; }
    .btn-sub { background: #777; color: white; }
    .btn-action-row { margin-top: 5px; }

    /* 描画画面コンテナ */
    #screen-draw { position: relative; }

    /* 左上の縦並びツールバー */
    .left-toolbar {
      position: absolute;
      top: 10px;
      left: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 10;
    }
    .tool-icon-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(34, 34, 34, 0.85);
      border: 2px solid white;
      color: white;
      font-size: 17px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
      padding: 0;
      margin: 0;
    }

    /* 画面中央ポップアップモーダル */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-overlay.active { display: flex; }
    .modal-content {
      background: #222;
      border: 2px solid #555;
      padding: 15px;
      border-radius: 15px;
      width: 80%;
      max-width: 280px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.8);
      text-align: center;
    }
    .modal-title { font-size: 15px; margin-bottom: 12px; font-weight: bold; color: #ff4081; }

    /* ポップアップ内のカラー・太さグリッド */
    .color-grid, .size-grid, .stamp-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      justify-items: center;
    }
    .pop-color-btn {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 2px solid white;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }
    .pop-btn {
      width: 100%;
      padding: 10px;
      background: #444;
      color: white;
      border: 1px solid #666;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- ================= 画面1: カメラ撮影 ================= -->
  <div id="screen-capture" class="screen active">
    <div class="viewfinder-container">
      <video id="cameraStream" autoplay playsinline muted></video>
    </div>
    <div>
      <button class="btn-main" onclick="takeSnapshot()">シャッター 📸</button>
    </div>
    <canvas id="hiddenCanvas" style="display:none;"></canvas>
  </div>

  <!-- ================= 画面2: プレビュー確認 ================= -->
  <div id="screen-preview" class="screen">
    <div style="font-size: 14px; font-weight: bold; margin-bottom: 2px;">👀 プレビュー確認</div>
    <div>
      <img id="previewImg" alt="プレビュー">
    </div>
    <div class="btn-action-row">
      <button class="btn-sub" onclick="retakePhoto()">🔄 撮り直す</button>
      <button class="btn-main" onclick="confirmPhoto()">✨ これでOK（描画へ）</button>
    </div>
  </div>

  <!-- ================= 画面3: 描画（デコ）画面 ================= -->
  <div id="screen-draw" class="screen">
    
    <!-- 左上の縦並びツールバー -->
    <div class="left-toolbar">
      <button class="tool-icon-btn" onclick="openModal('modal-color')" title="色">🎨</button>
      <button class="tool-icon-btn" onclick="openModal('modal-size')" title="太さ">✒️</button>
      <button class="tool-icon-btn" onclick="openModal('modal-stamp')" title="スタンプ">⭐</button>
      <button class="tool-icon-btn" onclick="undoCanvas()" title="戻す">↩️</button>
      <button class="tool-icon-btn" onclick="clearCanvas()" title="クリア" style="background:#b52b27;">🗑️</button>
    </div>

    <canvas id="chekiCanvas"></canvas>

    <div class="btn-action-row">
      <button class="btn-sub" onclick="retakePhoto()" style="padding: 6px 12px; font-size: 12px;">🔄 最初から</button>
      <button class="btn-main" onclick="saveCheki()" style="padding: 6px 12px; font-size: 12px;">💾 保存する</button>
    </div>
  </div>

  <!-- ================= 各種ポップアップモーダル ================= -->
  <!-- 色選択モーダル (黒・赤・青・黄・紫・緑・ピンク・白) -->
  <div id="modal-color" class="modal-overlay" onclick="closeModalOnBg(event, 'modal-color')">
    <div class="modal-content">
      <div class="modal-title">ペンの色を選択</div>
      <div class="color-grid">
        <button class="pop-color-btn" style="background:#000000; color:#fff;" onclick="setPenColor('#000000')">黒</button>
        <button class="pop-color-btn" style="background:#ff3b30; color:#fff;" onclick="setPenColor('#ff3b30')">赤</button>
        <button class="pop-color-btn" style="background:#007aff; color:#fff;" onclick="setPenColor('#007aff')">青</button>
        <button class="pop-color-btn" style="background:#ffcc00; color:#000;" onclick="setPenColor('#ffcc00')">黄</button>
        <button class="pop-color-btn" style="background:#ff00ff; color:#fff;" onclick="setPenColor('#ff00ff')">紫</button>
        <button class="pop-color-btn" style="background:#34c759; color:#fff;" onclick="setPenColor('#34c759')">緑</button>
        <button class="pop-color-btn" style="background:#ff69b4; color:#fff;" onclick="setPenColor('#ff69b4')">ピンク</button>
        <button class="pop-color-btn" style="background:#ffffff; color:#000;" onclick="setPenColor('#ffffff')">白</button>
      </div>
    </div>
  </div>

  <!-- 太さ選択モーダル -->
  <div id="modal-size" class="modal-overlay" onclick="closeModalOnBg(event, 'modal-size')">
    <div class="modal-content">
      <div class="modal-title">ペンの太さを選択</div>
      <div class="size-grid" style="grid-template-columns: 1fr;">
        <button class="pop-btn" onclick="setPenSize(4)">細</button>
        <button class="pop-btn" onclick="setPenSize(10)">中</button>
        <button class="pop-btn" onclick="setPenSize(20)">太</button>
      </div>
    </div>
  </div>

  <!-- スタンプ選択モーダル -->
  <div id="modal-stamp" class="modal-overlay" onclick="closeModalOnBg(event, 'modal-stamp')">
    <div class="modal-content">
      <div class="modal-title">スタンプを選択</div>
      <div class="stamp-grid">
        <button class="pop-btn" style="font-size:24px;" onclick="selectStamp('⭐')">⭐</button>
        <button class="pop-btn" style="font-size:24px;" onclick="selectStamp('✨')">✨</button>
        <button class="pop-btn" style="font-size:24px;" onclick="selectStamp('💖')">💖</button>
        <button class="pop-btn" style="font-size:18px;" onclick="selectStamp('推し')">推し</button>
      </div>
      <button class="pop-btn" style="margin-top:12px; background:#444;" onclick="cancelStamp()">ペンモードに戻る</button>
    </div>
  </div>

  <script>
    const video = document.getElementById('cameraStream');
    let mediaStream = null;
    let capturedBlob = null;

    const canvas = document.getElementById('chekiCanvas');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;
    let penColor = '#000000';
    let penSize = 10;
    let selectedStamp = null;
    let history = [];
    let baseImage = null;

    function switchScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    async function startCamera() {
      switchScreen('screen-capture');
      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 1080 }, height: { ideal: 1440 } },
          audio: false
        });
        video.srcObject = mediaStream;
      } catch (err) {
        document.body.addEventListener('click', retryCameraOnce, { once: true });
      }
    }

    async function retryCameraOnce() {
      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 1080 }, height: { ideal: 1440 } },
          audio: false
        });
        video.srcObject = mediaStream;
      } catch (e) {
        alert('カメラのアクセスを許可してください。');
      }
    }

    function takeSnapshot() {
      const hiddenCanvas = document.getElementById('hiddenCanvas');
      const hCtx = hiddenCanvas.getContext('2d');

      const targetW = 600;
      const targetH = 800; // 3:4比率
      hiddenCanvas.width = targetW;
      hiddenCanvas.height = targetH;

      hCtx.fillStyle = '#ffffff';
      hCtx.fillRect(0, 0, targetW, targetH);

      const pX = 35, pY = 35, pW = 530, pH = 707;
      const vW = video.videoWidth, vH = video.videoHeight;
      const vAspect = vW / vH, targetAspect = pW / pH;

      let sx, sy, sW, sH;
      if (vAspect > targetAspect) {
        sH = vH; sW = vH * targetAspect; sx = (vW - sW) / 2; sy = 0;
      } else {
        sW = vW; sH = vW / targetAspect; sx = 0; sy = (vH - sH) / 2;
      }

      hCtx.drawImage(video, sx, sy, sW, sH, pX, pY, pW, pH);

      hiddenCanvas.toBlob(function(blob) {
        capturedBlob = blob;
        const imageUrl = URL.createObjectURL(blob);
        document.getElementById('previewImg').src = imageUrl;

        if (mediaStream) {
          mediaStream.getTracks().forEach(track => track.stop());
        }
        switchScreen('screen-preview');
      }, 'image/jpeg', 0.9);
    }

    function retakePhoto() {
      capturedBlob = null;
      startCamera();
    }

    function confirmPhoto() {
      if (!capturedBlob) return;

      const downloadLink = document.createElement('a');
      const url = URL.createObjectURL(capturedBlob);
      downloadLink.href = url;
      downloadLink.download = `cheki_original_${Date.now()}.jpg`;
      document.body.appendChild(downloadLink);
      downloadLink.click();
      document.body.removeChild(downloadLink);

      canvas.width = 600;
      canvas.height = 800;

      const img = new Image();
      baseImage = img;
      img.onload = function() {
        ctx.drawImage(img, 0, 0);
        history = [];
        saveHistory();
        switchScreen('screen-draw');
        initDrawingEvents();
      };
      img.src = url;
    }

    function openModal(modalId) {
      document.getElementById(modalId).classList.add('active');
    }
    function closeModal(modalId) {
      document.getElementById(modalId).classList.remove('active');
    }
    function closeModalOnBg(e, modalId) {
      if (e.target.id === modalId) {
        closeModal(modalId);
      }
    }

    function setPenColor(color) {
      penColor = color;
      selectedStamp = null;
      closeModal('modal-color');
    }

    function setPenSize(size) {
      penSize = size;
      closeModal('modal-size');
    }

    function selectStamp(stampText) {
      selectedStamp = stampText;
      closeModal('modal-stamp');
    }

    function cancelStamp() {
      selectedStamp = null;
      closeModal('modal-stamp');
    }

    function initDrawingEvents() {
      canvas.onmousedown = handleCanvasDown;
      canvas.onmousemove = handleCanvasMove;
      canvas.onmouseup = handleCanvasUp;
      canvas.onmouseleave = handleCanvasUp;

      canvas.ontouchstart = (e) => { e.preventDefault(); handleCanvasDown(e.touches[0]); };
      canvas.ontouchmove = (e) => { e.preventDefault(); handleCanvasMove(e.touches[0]); };
      canvas.ontouchend = handleCanvasUp;
    }

    function getMousePos(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      return {
        x: (e.clientX - rect.left) * scaleX,
        y: (e.clientY - rect.top) * scaleY
      };
    }

    function handleCanvasDown(e) {
      const pos = getMousePos(e);

      if (selectedStamp) {
        ctx.save();
        ctx.font = 'bold 60px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowColor = 'white';
        ctx.shadowBlur = 10;
        ctx.fillText(selectedStamp, pos.x, pos.y);
        ctx.restore();
        saveHistory();
      } else {
        isDrawing = true;
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
        ctx.strokeStyle = penColor;
        ctx.lineWidth = penSize;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
      }
    }

    function handleCanvasMove(e) {
      if (!isDrawing || selectedStamp) return;
      const pos = getMousePos(e);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    }

    function handleCanvasUp() {
      if (isDrawing) {
        isDrawing = false;
        saveHistory();
      }
    }

    function saveHistory() {
      if (history.length > 15) history.shift();
      history.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
    }

    function undoCanvas() {
      if (history.length > 1) {
        history.pop();
        const prev = history[history.length - 1];
        ctx.putImageData(prev, 0, 0);
      }
    }

    function clearCanvas() {
      if (confirm('描画をすべてクリアしますか？')) {
        if (baseImage) {
          ctx.drawImage(baseImage, 0, 0);
          history = [];
          saveHistory();
        }
      }
    }

    function saveCheki() {
      canvas.toBlob(function(blob) {
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `cheki_deco_${Date.now()}.jpg`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        alert('デコチェキを保存しました！');
      }, 'image/jpeg', 0.9);
    }

    window.addEventListener('load', startCamera);
  </script>
</body>
</html>
