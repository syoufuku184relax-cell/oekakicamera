<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>特典会チェキアプリ</title>
  <style>
    body { text-align: center; background: #111; color: white; font-family: sans-serif; margin: 0; padding: 10px; touch-action: manipulation; }
    .screen { display: none; }
    .screen.active { display: block; }
    
    canvas, img { max-width: 90vw; max-height: 52vh; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.6); background: white; object-fit: contain; }
    
    /* チェキ風ファインダー */
    .viewfinder-container {
      position: relative;
      display: inline-block;
      background: white;
      padding: 15px 15px 50px 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      border-radius: 6px;
      margin-top: 10px;
    }
    video {
      width: 100%;
      max-width: 380px;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      background: #000;
      display: block;
    }

    button { padding: 12px 20px; font-size: 15px; margin: 5px; cursor: pointer; border: none; border-radius: 25px; font-weight: bold; }
    .btn-main { background: #ff4081; color: white; }
    .btn-sub { background: #777; color: white; }
    .btn-clear { background: #d9534f; color: white; }
    .btn-action-row { margin-top: 10px; }

    /* 描画ツール用コントロールパネル */
    .tool-panel {
      background: #222;
      padding: 8px;
      border-radius: 10px;
      margin-top: 8px;
      display: inline-block;
      max-width: 95vw;
    }
    
    /* カラーボタン（色名表示） */
    .color-btn {
      width: 36px; height: 36px; border-radius: 50%; border: 2px solid white;
      display: inline-flex; align-items: center; justify-content: center;
      margin: 0 3px; cursor: pointer; vertical-align: middle;
      font-size: 11px; font-weight: bold;
    }
    .color-btn.active { border: 3px solid #ff4081; transform: scale(1.1); }
    
    .size-btn { padding: 5px 10px; font-size: 12px; border-radius: 15px; background: #444; color: white; border: 1px solid #666; margin: 0 2px; }
    .size-btn.active { background: #ff4081; border-color: #ff4081; }
    
    /* スタンプボタン */
    .stamp-btn { font-size: 20px; padding: 4px 10px; background: #333; border-radius: 8px; border: 1px solid #555; margin: 0 3px; cursor: pointer; }
    .stamp-btn.active { background: #ff4081; border-color: white; }
  </style>
</head>
<body>

  <!-- ================= 画面1: 即カメラモード ================= -->
  <div id="screen-capture" class="screen active">
    <div class="viewfinder-container">
      <video id="cameraStream" autoplay playsinline muted></video>
    </div>
    <div>
      <button class="btn-main" onclick="takeSnapshot()">シャッター 📸</button>
    </div>
    <canvas id="hiddenCanvas" style="display:none;"></canvas>
  </div>

  <!-- ================= 画面2: プレビュー確認画面 ================= -->
  <div id="screen-preview" class="screen">
    <h3>👀 プレビュー確認</h3>
    <div>
      <img id="previewImg" alt="プレビュー">
    </div>
    <div class="btn-action-row">
      <button class="btn-sub" onclick="retakePhoto()">🔄 撮り直す</button>
      <button class="btn-main" onclick="confirmPhoto()">✨ これでOK（描画へ）</button>
    </div>
  </div>

  <!-- ================= 画面3: 描画（デコ）画面 ================= -->
  <div id="screen-draw" class="screen">
    <canvas id="chekiCanvas"></canvas>
    
    <!-- ツールパネル -->
    <div class="tool-panel">
      <!-- ペンカラー（黒・赤・青・黄・紫・緑・白） -->
      <div>
        <span class="color-btn active" style="background:#000000; color:#fff;" onclick="setPenColor('#000000', this)">黒</span>
        <span class="color-btn" style="background:#ff3b30; color:#fff;" onclick="setPenColor('#ff3b30', this)">赤</span>
        <span class="color-btn" style="background:#007aff; color:#fff;" onclick="setPenColor('#007aff', this)">青</span>
        <span class="color-btn" style="background:#ffcc00; color:#000;" onclick="setPenColor('#ffcc00', this)">黄</span>
        <span class="color-btn" style="background:#ff00ff; color:#fff;" onclick="setPenColor('#ff00ff', this)">紫</span>
        <span class="color-btn" style="background:#34c759; color:#fff;" onclick="setPenColor('#34c759', this)">緑</span>
        <span class="color-btn" style="background:#ffffff; color:#000;" onclick="setPenColor('#ffffff', this)">白</span>
      </div>

      <!-- ペン太さ & 戻す & クリア -->
      <div style="margin-top: 6px;">
        <button class="size-btn" onclick="setPenSize(3, this)">細</button>
        <button class="size-btn active" onclick="setPenSize(7, this)">中</button>
        <button class="size-btn" onclick="setPenSize(14, this)">太</button>
        <button class="size-btn" style="background:#555;" onclick="undoCanvas()">↩️戻す</button>
        <button class="size-btn btn-clear" style="background:#b52b27; border:none;" onclick="clearCanvas()">🗑️クリア</button>
      </div>

      <!-- スタンプ選択（タップして配置モード切り替え） -->
      <div style="margin-top: 6px;">
        <span style="font-size:11px; color:#aaa; margin-right:3px;">スタンプ:</span>
        <button class="stamp-btn" onclick="selectStamp('⭐', this)">⭐</button>
        <button class="stamp-btn" onclick="selectStamp('✨', this)">✨</button>
        <button class="stamp-btn" onclick="selectStamp('💖', this)">💖</button>
        <button class="stamp-btn" onclick="selectStamp('推し', this)">推し</button>
        <button class="size-btn" style="background:#333; margin-left:5px;" onclick="cancelStamp()">ペンに戻る</button>
      </div>
    </div>

    <div class="btn-action-row">
      <button class="btn-sub" onclick="retakePhoto()">🔄 最初から</button>
      <button class="btn-main" onclick="saveCheki()">💾 保存する</button>
    </div>
  </div>

  <script>
    const video = document.getElementById('cameraStream');
    let mediaStream = null;
    let capturedBlob = null;

    const canvas = document.getElementById('chekiCanvas');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;
    let penColor = '#000000';
    let penSize = 7;
    let selectedStamp = null; // 選択中のスタンプ
    let history = [];
    let baseImage = null; // クリア用・ベース画像

    function switchScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    async function startCamera() {
      switchScreen('screen-capture');
      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        video.srcObject = mediaStream;
      } catch (err) {
        document.body.addEventListener('click', retryCameraOnce, { once: true });
      }
    }

    async function retryCameraOnce() {
      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        video.srcObject = mediaStream;
      } catch (e) {
        alert('カメラのアクセスを許可してください。');
      }
    }

    function takeSnapshot() {
      const hiddenCanvas = document.getElementById('hiddenCanvas');
      const hCtx = hiddenCanvas.getContext('2d');

      const targetW = 600;
      const targetH = 850;
      hiddenCanvas.width = targetW;
      hiddenCanvas.height = targetH;

      hCtx.fillStyle = '#ffffff';
      hCtx.fillRect(0, 0, targetW, targetH);

      const pX = 40, pY = 40, pW = 520, pH = 693;
      const vW = video.videoWidth, vH = video.videoHeight;
      const vAspect = vW / vH, targetAspect = pW / pH;

      let sx, sy, sW, sH;
      if (vAspect > targetAspect) {
        sH = vH; sW = vH * targetAspect; sx = (vW - sW) / 2; sy = 0;
      } else {
        sW = vW; sH = vH / targetAspect; sx = 0; sy = (vH - sH) / 2;
      }

      hCtx.drawImage(video, sx, sy, sW, sH, pX, pY, pW, pH);

      hiddenCanvas.toBlob(function(blob) {
        capturedBlob = blob;
        const imageUrl = URL.createObjectURL(blob);
        document.getElementById('previewImg').src = imageUrl;

        if (mediaStream) {
          mediaStream.getTracks().forEach(track => track.stop());
        }
        switchScreen('screen-preview');
      }, 'image/jpeg', 0.85);
    }

    function retakePhoto() {
      capturedBlob = null;
      startCamera();
    }

    // --- プレビュー確認：「これでOK」で即保存 ＆ 描画画面へ ---
    function confirmPhoto() {
      if (!capturedBlob) return;

      // 自動保存処理
      const downloadLink = document.createElement('a');
      const url = URL.createObjectURL(capturedBlob);
      downloadLink.href = url;
      downloadLink.download = `cheki_original_${Date.now()}.jpg`;
      document.body.appendChild(downloadLink);
      downloadLink.click();
      document.body.removeChild(downloadLink);

      canvas.width = 600;
      canvas.height = 850;

      const img = new Image();
      baseImage = img; // クリア用に保持
      img.onload = function() {
        ctx.drawImage(img, 0, 0);
        history = [];
        saveHistory();
        switchScreen('screen-draw');
        initDrawingEvents();
      };
      img.src = url;
    }

    // --- 描画＆スタンプ操作イベント ---
    function initDrawingEvents() {
      canvas.onmousedown = handleCanvasDown;
      canvas.onmousemove = handleCanvasMove;
      canvas.onmouseup = handleCanvasUp;
      canvas.onmouseleave = handleCanvasUp;

      canvas.ontouchstart = (e) => { e.preventDefault(); handleCanvasDown(e.touches[0]); };
      canvas.ontouchmove = (e) => { e.preventDefault(); handleCanvasMove(e.touches[0]); };
      canvas.ontouchend = handleCanvasUp;
    }

    function getMousePos(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      return {
        x: (e.clientX - rect.left) * scaleX,
        y: (e.clientY - rect.top) * scaleY
      };
    }

    function handleCanvasDown(e) {
      const pos = getMousePos(e);

      if (selectedStamp) {
        // スタンプ配置モードのとき：タップした場所にスタンプを置く
        ctx.save();
        ctx.font = 'bold 50px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowColor = 'white';
        ctx.shadowBlur = 10;
        ctx.fillText(selectedStamp, pos.x, pos.y);
        ctx.restore();
        saveHistory();
      } else {
        // 通常のペン描きモード
        isDrawing = true;
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
        ctx.strokeStyle = penColor;
        ctx.lineWidth = penSize;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
      }
    }

    function handleCanvasMove(e) {
      if (!isDrawing || selectedStamp) return;
      const pos = getMousePos(e);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    }

    function handleCanvasUp() {
      if (isDrawing) {
        isDrawing = false;
        saveHistory();
      }
    }

    // --- 履歴・クリア管理 ---
    function saveHistory() {
      if (history.length > 15) history.shift();
      history.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
    }

    function undoCanvas() {
      if (history.length > 1) {
        history.pop();
        const prev = history[history.length - 1];
        ctx.putImageData(prev, 0, 0);
      }
    }

    function clearCanvas() {
      if (baseImage) {
        ctx.drawImage(baseImage, 0, 0);
        history = [];
        saveHistory();
      }
    }

    // --- ツール選択 ---
    function setPenColor(color, element) {
      penColor = color;
      cancelStamp(); // スタンプモード解除
      document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
      element.classList.add('active');
    }

    function setPenSize(size, element) {
      penSize = size;
      document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
      if(element) element.classList.add('active');
    }

    function selectStamp(stampText, element) {
      selectedStamp = stampText;
      document.querySelectorAll('.stamp-btn').forEach(b => b.classList.remove('active'));
      element.classList.add('active');
    }

    function cancelStamp() {
      selectedStamp = null;
      document.querySelectorAll('.stamp-btn').forEach(b => b.classList.remove('active'));
    }

    // --- 最終保存処理 ---
    function saveCheki() {
      canvas.toBlob(function(blob) {
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `cheki_deco_${Date.now()}.jpg`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        alert('デコチェキを保存しました！');
      }, 'image/jpeg', 0.9);
    }

    window.addEventListener('load', startCamera);
  </script>
</body>
</html>
