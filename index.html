<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>特典会チェキアプリ（プレビュー＆簡単設定対応）</title>
  <style>
    /* 画面のスクロールや引っ張り更新を完全に防止 */
    html, body {
      width: 100%; height: 100%;
      margin: 0; padding: 0;
      overflow: hidden;
      position: fixed;
      background: #000;
      color: white;
      font-family: sans-serif;
      touch-action: none;
    }

    .screen {
      display: none;
      width: 100vw; height: 100vh;
      box-sizing: border-box;
      position: absolute;
      top: 0; left: 0;
    }
    .screen.active {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    
    /* 共通ビュー・プレビュー画像サイズ */
    .viewfinder-container, .preview-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    video, .preview-image {
      width: 88vw;
      max-width: 400px;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      background: #000;
      border-radius: 8px;
    }

    /* 描画キャンバス */
    #chekiCanvas {
      width: 95vw;
      max-height: 82vh;
      aspect-ratio: 3 / 4;
      border-radius: 4px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.8);
      background: white;
      object-fit: contain;
      touch-action: none;
    }

    button { font-size: 14px; cursor: pointer; border: none; border-radius: 20px; font-weight: bold; }
    .btn-main { background: #ff4081; color: white; padding: 12px 28px; font-size: 16px; }
    .btn-sub { background: #555; color: white; padding: 10px 18px; }
    .btn-retry { background: #b52b27; color: white; padding: 12px 24px; font-size: 15px; }

    /* 画面上部の横並びツールバー */
    .top-toolbar {
      position: absolute;
      top: 8px;
      left: 0; width: 100%;
      display: flex;
      justify-content: center;
      gap: 6px;
      z-index: 10;
      padding: 0 5px;
      box-sizing: border-box;
    }
    .tool-icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(30, 30, 30, 0.9);
      border: 2px solid white;
      color: white;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
    }

    /* ポップアップモーダル */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-overlay.active { display: flex; }
    .modal-content {
      background: #222;
      border: 2px solid #555;
      padding: 16px;
      border-radius: 16px;
      width: 86%;
      max-width: 340px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.9);
      text-align: center;
      box-sizing: border-box;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-title { font-size: 15px; margin-bottom: 12px; font-weight: bold; color: #ff4081; }

    .color-grid, .size-grid, .stamp-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    .pop-color-btn, .pop-btn {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 2px solid white;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
      color: white;
    }
    .pop-btn { background: #444; border: 1px solid #666; }

    /* 設定画面スタイル */
    .setting-group { margin-bottom: 10px; text-align: left; font-size: 13px; }
    .setting-group label { display: block; margin-bottom: 3px; color: #aaa; }
    .setting-group input, .setting-group select {
      width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #555; background: #333; color: white; box-sizing: border-box;
    }
    .idol-item-row {
      display: flex; align-items: center; justify-content: space-between;
      background: #2a2a2a; padding: 6px 10px; border-radius: 6px; margin-bottom: 4px; font-size: 13px;
    }
  </style>
</head>
<body>

  <!-- ================= 画面1: カメラ撮影 ================= -->
  <div id="screen-capture" class="screen active">
    <div style="position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; align-items: center; z-index: 5;">
      <div id="currentInfoDisplay" style="font-size: 12px; background: rgba(0,0,0,0.6); padding: 5px 10px; border-radius: 10px; border: 1px solid #555;">
        読み込み中...
      </div>
      <button class="btn-sub" style="padding: 6px 12px; font-size: 12px;" onclick="openModal('modal-settings')">⚙️ 設定</button>
    </div>

    <div class="viewfinder-container" style="margin-top: 25px;">
      <video id="cameraStream" autoplay playsinline muted></video>
    </div>

    <div style="margin-top: 15px;">
      <button class="btn-main" onclick="takeSnapshot()">シャッター 📸</button>
    </div>
    <canvas id="hiddenCanvas" style="display:none;"></canvas>
  </div>

  <!-- ================= 画面2: プレビュー確認画面 ================= -->
  <div id="screen-preview" class="screen">
    <div style="font-size: 14px; margin-bottom: 8px; font-weight: bold; color: #ffcc00;">プレビュー確認</div>
    <div class="preview-container">
      <img id="previewImageElement" class="preview-image" alt="プレビュー">
    </div>
    <div style="display: flex; gap: 15px; margin-top: 15px;">
      <button class="btn-retry" onclick="backToCamera()">撮り直す 🔄</button>
      <button class="btn-main" onclick="proceedToDraw()">落書きへ ✍️</button>
    </div>
  </div>

  <!-- ================= 画面3: 描画（デコ）画面 ================= -->
  <div id="screen-draw" class="screen">
    <div class="top-toolbar">
      <button class="tool-icon-btn" onclick="openModal('modal-color')" title="色">🎨</button>
      <button class="tool-icon-btn" onclick="openModal('modal-size')" title="太さ">✒️</button>
      <button class="tool-icon-btn" onclick="openModal('modal-stamp')" title="スタンプ">⭐</button>
      <button class="tool-icon-btn" onclick="undoCanvas()" title="戻す">↩️</button>
      <button class="tool-icon-btn" onclick="clearCanvas()" title="クリア" style="background:#b52b27;">🗑️</button>
      <button class="tool-icon-btn" onclick="saveCheki()" title="保存" style="background:#28a745;">💾</button>
    </div>
    <canvas id="chekiCanvas"></canvas>
  </div>

  <!-- ================= 各種ポップアップモーダル ================= -->

  <!-- 色選択モーダル -->
  <div id="modal-color" class="modal-overlay" onclick="closeModalOnBg(event, 'modal-color')">
    <div class="modal-content">
      <div class="modal-title">ペンの色を選択</div>
      <div class="color-grid">
        <button class="pop-color-btn" style="background:#000000;" onclick="setPenColor('#000000')">黒</button>
        <button class="pop-color-btn" style="background:#ff3b30;" onclick="setPenColor('#ff3b30')">赤</button>
        <button class="pop-color-btn" style="background:#007aff;" onclick="setPenColor('#007aff')">青</button>
        <button class="pop-color-btn" style="background:#ffcc00; color:#000;" onclick="setPenColor('#ffcc00')">黄</button>
        <button class="pop-color-btn" style="background:#ff00ff;" onclick="setPenColor('#ff00ff')">紫</button>
        <button class="pop-color-btn" style="background:#34c759;" onclick="setPenColor('#34c759')">緑</button>
        <button class="pop-color-btn" style="background:#ff69b4;" onclick="setPenColor('#ff69b4')">ピンク</button>
        <button class="pop-color-btn" style="background:#ffffff; color:#000;" onclick="setPenColor('#ffffff')">白</button>
      </div>
    </div>
  </div>

  <!-- 太さ選択モーダル -->
  <div id="modal-size" class="modal-overlay" onclick="closeModalOnBg(event, 'modal-size')">
    <div class="modal-content">
      <div class="modal-title">ペンの太さを選択</div>
      <div class="size-grid" style="grid-template-columns: 1fr;">
        <button class="pop-btn" onclick="setPenSize(6)">細</button>
        <button class="pop-btn" onclick="setPenSize(14)">中</button>
        <button class="pop-btn" onclick="setPenSize(26)">太</button>
      </div>
    </div>
  </div>

  <!-- スタンプ選択モーダル -->
  <div id="modal-stamp" class="modal-overlay" onclick="closeModalOnBg(event, 'modal-stamp')">
    <div class="modal-content">
      <div class="modal-title">スタンプを選択</div>
      <div class="stamp-grid">
        <button class="pop-btn" style="font-size:24px;" onclick="selectStamp('⭐')">⭐</button>
        <button class="pop-btn" style="font-size:24px;" onclick="selectStamp('✨')">✨</button>
        <button class="pop-btn" style="font-size:24px;" onclick="selectStamp('💖')">💖</button>
        <button class="pop-btn" style="font-size:18px;" onclick="selectStamp('推し')">推し</button>
      </div>
      <button class="pop-btn" style="margin-top:10px; background:#444;" onclick="cancelStamp()">ペンモードに戻る</button>
    </div>
  </div>

  <!-- 完了・保存確認ポップアップ -->
  <div id="modal-saved" class="modal-overlay">
    <div class="modal-content" style="text-align:center;">
      <div class="modal-title" style="color:#28a745;">💾 保存が完了しました！</div>
      <img id="savedResultImage" style="width: 100%; border-radius: 6px; margin: 10px 0; aspect-ratio:3/4; object-fit:contain; background:#000;" alt="保存画像">
      <button class="btn-main" style="width:100%; padding:10px; margin-top:5px;" onclick="finishAndResetCamera()">次の撮影へ 📸</button>
    </div>
  </div>

  <!-- 設定変更モーダル（簡易メンバー追加機能付き） -->
  <div id="modal-settings" class="modal-overlay" onclick="closeModalOnBg(event, 'modal-settings')">
    <div class="modal-content">
      <div class="modal-title">アプリ設定 ＆ メンバー管理</div>
      
      <div class="setting-group">
        <label>端末ID</label>
        <input type="text" id="settingDeviceId" placeholder="例: DEV-01">
      </div>
      <div class="setting-group">
        <label>グループ名</label>
        <input type="text" id="settingGroupName" placeholder="例: サンプルグループ">
      </div>

      <div class="setting-group">
        <label>現在登録されているメンバー</label>
        <div id="idolListContainer" style="max-height: 100px; overflow-y: auto; border: 1px solid #444; border-radius: 6px; padding: 4px; background:#181818;"></div>
      </div>

      <!-- 簡易メンバー追加フォーム -->
      <div style="background: #2a2a2a; padding: 8px; border-radius: 8px; border: 1px dashed #666; margin-bottom: 10px;">
        <label style="font-size: 12px; color: #ff4081; font-weight: bold; margin-bottom: 4px; display:block;">➕ メンバーを簡単追加</label>
        <div style="display: flex; gap: 6px; margin-bottom: 6px;">
          <input type="text" id="newIdolName" placeholder="メンバー名" style="flex: 2; padding: 6px; background:#333; color:white; border:1px solid #555; border-radius:4px; font-size:12px;">
          <input type="color" id="newIdolColor" value="#ff69b4" style="width: 35px; height: 32px; border: none; background: none; cursor: pointer;">
        </div>
        <button class="pop-btn" style="width: 100%; background: #449d44; padding: 6px; font-size: 12px;" onclick="addNewIdolSimple()">このメンバーを追加する</button>
      </div>

      <div class="setting-group">
        <label>撮影時に選択するアイドル</label>
        <select id="settingSelectIdol"></select>
      </div>

      <button class="btn-main" style="width:100%; margin-top:5px; padding:10px;" onclick="saveSettings()">設定を保存して閉じる</button>
    </div>
  </div>

  <script>
    // --- 設定データ管理 ---
    let appConfig = {
      deviceId: "DEV-A",
      groupName: "推しグループ",
      idols: [
        { name: "メンバーA", color: "#ff69b4" },
        { name: "メンバーB", color: "#007aff" },
        { name: "メンバーC", color: "#ffcc00" }
      ],
      selectedIndex: 0
    };

    function loadSettings() {
      const saved = localStorage.getItem('cheki_settings');
      if (saved) {
        try { appConfig = JSON.parse(saved); } catch(e) {}
      }
      updateSettingsUI();
    }

    function updateSettingsUI() {
      document.getElementById('settingDeviceId').value = appConfig.deviceId || "DEV-A";
      document.getElementById('settingGroupName').value = appConfig.groupName || "";
      
      // 登録メンバーリスト描画
      const container = document.getElementById('idolListContainer');
      container.innerHTML = '';
      appConfig.idols.forEach((idol, idx) => {
        let row = document.createElement('div');
        row.className = 'idol-item-row';
        row.innerHTML = `
          <div style="display:flex; align-items:center; gap:6px;">
            <span style="width:12px; height:12px; background:${idol.color}; border-radius:50%; display:inline-block;"></span>
            <span>${idol.name}</span>
          </div>
          <button style="background:#b52b27; color:white; border:none; padding:2px 6px; border-radius:4px; font-size:11px;" onclick="removeIdol(${idx})">削除</button>
        `;
        container.appendChild(row);
      });

      // セレクトボックス更新
      const select = document.getElementById('settingSelectIdol');
      select.innerHTML = '';
      appConfig.idols.forEach((idol, idx) => {
        let opt = document.createElement('option');
        opt.value = idx;
        opt.text = `${idol.name} (${appConfig.groupName})`;
        if(idx === appConfig.selectedIndex) opt.selected = true;
        select.appendChild(opt);
      });

      let currentIdol = appConfig.idols[appConfig.selectedIndex] || appConfig.idols[0];
      document.getElementById('currentInfoDisplay').innerText = `👤 ${currentIdol ? currentIdol.name : '未選択'} [${appConfig.deviceId}]`;
    }

    function addNewIdolSimple() {
      const nameInput = document.getElementById('newIdolName');
      const colorInput = document.getElementById('newIdolColor');
      const name = nameInput.value.trim();
      
      if(!name) {
        alert('メンバー名を入力してください。');
        return;
      }
      appConfig.idols.push({ name: name, color: colorInput.value });
      nameInput.value = '';
      updateSettingsUI();
      // 即座にストレージ保存
      localStorage.setItem('cheki_settings', JSON.stringify(appConfig));
    }

    function removeIdol(idx) {
      if(appConfig.idols.length <= 1) {
        alert('最低1人のメンバーが必要です。');
        return;
      }
      appConfig.idols.splice(idx, 1);
      if(appConfig.selectedIndex >= appConfig.idols.length) {
        appConfig.selectedIndex = appConfig.idols.length - 1;
      }
      updateSettingsUI();
      localStorage.setItem('cheki_settings', JSON.stringify(appConfig));
    }

    function saveSettings() {
      appConfig.deviceId = document.getElementById('settingDeviceId').value || "DEV-A";
      appConfig.groupName = document.getElementById('settingGroupName').value || "";
      appConfig.selectedIndex = parseInt(document.getElementById('settingSelectIdol').value) || 0;

      localStorage.setItem('cheki_settings', JSON.stringify(appConfig));
      closeModal('modal-settings');
      updateSettingsUI();
    }

    loadSettings();
    document.getElementById('settingSelectIdol').addEventListener('change', (e) => {
      appConfig.selectedIndex = parseInt(e.target.value);
      localStorage.setItem('cheki_settings', JSON.stringify(appConfig));
      updateSettingsUI();
    });


    // --- カメラ・プレビュー・描画制御 ---
    const video = document.getElementById('cameraStream');
    let mediaStream = null;
    let rawSnapshotBlobUrl = null;

    const canvas = document.getElementById('chekiCanvas');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;
    let penColor = '#000000';
    let penSize = 14;
    let selectedStamp = null;
    let history = [];
    let baseImage = null;

    function switchScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    async function startCamera() {
      switchScreen('screen-capture');
      try {
        if (mediaStream) {
          mediaStream.getTracks().forEach(track => track.stop());
        }
        mediaStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 1080 }, height: { ideal: 1440 } },
          audio: false
        });
        video.srcObject = mediaStream;
      } catch (err) {
        document.body.addEventListener('click', retryCameraOnce, { once: true });
      }
    }

    async function retryCameraOnce() {
      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 1080 }, height: { ideal: 1440 } },
          audio: false
        });
        video.srcObject = mediaStream;
      } catch (e) {
        alert('カメラのアクセスを許可してください。');
      }
    }

    function backToCamera() {
      startCamera();
    }

    function generateSerialId() {
      const now = new Date();
      const dateStr = `${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, '0')}${String(now.getDate()).padStart(2, '0')}`;
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
      let randStr = '';
      for(let i=0; i<4; i++) randStr += chars.charAt(Math.floor(Math.random() * chars.length));
      return `${appConfig.deviceId}-${dateStr}-${randStr}`;
    }

    // シャッターボタン → チェキ合成してプレビュー表示
    function takeSnapshot() {
      const hiddenCanvas = document.getElementById('hiddenCanvas');
      const hCtx = hiddenCanvas.getContext('2d');

      const targetW = 600;
      const targetH = 800;
      hiddenCanvas.width = targetW;
      hiddenCanvas.height = targetH;

      let currentIdol = appConfig.idols[appConfig.selectedIndex] || { color: '#ffffff' };
      hCtx.fillStyle = currentIdol.color;
      hCtx.fillRect(0, 0, targetW, targetH);

      const pX = 30, pY = 30, pW = 540, pH = 670;
      const vW = video.videoWidth, vH = video.videoHeight;
      const vAspect = vW / vH, targetAspect = pW / pH;

      let sx, sy, sW, sH;
      if (vAspect > targetAspect) {
        sH = vH; sW = vH * targetAspect; sx = (vW - sW) / 2; sy = 0;
      } else {
        sW = vW; sH = vW / targetAspect; sx = 0; sy = (vH - sH) / 2;
      }

      hCtx.drawImage(video, sx, sy, sW, sH, pX, pY, pW, pH);

      const now = new Date();
      const dateText = `${now.getFullYear()}.${now.getMonth()+1}.${now.getDate()}`;
      const serialText = generateSerialId();

      hCtx.fillStyle = '#333333';
      hCtx.font = 'bold 16px sans-serif';
      hCtx.textAlign = 'left';
      hCtx.fillText(dateText, 35, 765);
      hCtx.textAlign = 'right';
      hCtx.font = '14px monospace';
      hCtx.fillText(serialText, 565, 765);

      hiddenCanvas.toBlob(function(blob) {
        if(rawSnapshotBlobUrl) URL.revokeObjectURL(rawSnapshotBlobUrl);
        rawSnapshotBlobUrl = URL.createObjectURL(blob);
        
        document.getElementById('previewImageElement').src = rawSnapshotBlobUrl;
        
        // カメラ停止
        if (mediaStream) {
          mediaStream.getTracks().forEach(track => track.stop());
        }
        // プレビュー画面へ移動
        switchScreen('screen-preview');
      }, 'image/jpeg', 0.9);
    }

    // プレビューから「落書きへ」進む
    function proceedToDraw() {
      canvas.width = 600;
      canvas.height = 800;

      const img = new Image();
      baseImage = img;
      img.onload = function() {
        ctx.drawImage(img, 0, 0);
        history = [];
        saveHistory();
        switchScreen('screen-draw');
        initDrawingEvents();
      };
      img.src = rawSnapshotBlobUrl;
    }

    // --- ポップアップ・ツール制御 ---
    function openModal(modalId) { document.getElementById(modalId).classList.add('active'); }
    function closeModal(modalId) { document.getElementById(modalId).classList.remove('active'); }
    function closeModalOnBg(e, modalId) { if (e.target.id === modalId) closeModal(modalId); }

    function setPenColor(color) { penColor = color; selectedStamp = null; closeModal('modal-color'); }
    function setPenSize(size) { penSize = size; closeModal('modal-size'); }
    function selectStamp(stampText) { selectedStamp = stampText; closeModal('modal-stamp'); }
    function cancelStamp() { selectedStamp = null; closeModal('modal-stamp'); }

    // --- 描画イベント ---
    function initDrawingEvents() {
      canvas.onmousedown = handleCanvasDown;
      canvas.onmousemove = handleCanvasMove;
      canvas.onmouseup = handleCanvasUp;
      canvas.onmouseleave = handleCanvasUp;

      canvas.ontouchstart = (e) => { e.preventDefault(); handleCanvasDown(e.touches[0]); };
      canvas.ontouchmove = (e) => { e.preventDefault(); handleCanvasMove(e.touches[0]); };
      canvas.ontouchend = handleCanvasUp;
    }

    function getMousePos(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      return {
        x: (e.clientX - rect.left) * scaleX,
        y: (e.clientY - rect.top) * scaleY
      };
    }

    function handleCanvasDown(e) {
      const pos = getMousePos(e);
      if (selectedStamp) {
        ctx.save();
        ctx.font = 'bold 65px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowColor = 'white';
        ctx.shadowBlur = 12;
        ctx.fillText(selectedStamp, pos.x, pos.y);
        ctx.restore();
        saveHistory();
      } else {
        isDrawing = true;
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
        ctx.strokeStyle = penColor;
        ctx.lineWidth = penSize;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
      }
    }

    function handleCanvasMove(e) {
      if (!isDrawing || selectedStamp) return;
      const pos = getMousePos(e);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    }

    function handleCanvasUp() {
      if (isDrawing) {
        isDrawing = false;
        saveHistory();
      }
    }

    function saveHistory() {
      if (history.length > 15) history.shift();
      history.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
    }

    function undoCanvas() {
      if (history.length > 1) {
        history.pop();
        ctx.putImageData(history[history.length - 1], 0, 0);
      }
    }

    function clearCanvas() {
      if (confirm('描画をすべてクリアしますか？')) {
        if (baseImage) {
          ctx.drawImage(baseImage, 0, 0);
          history = [];
          saveHistory();
        }
      }
    }

    // --- 保存処理 ＆ 画像確認ポップアップ ---
    function saveCheki() {
      canvas.toBlob(function(blob) {
        const url = URL.createObjectURL(blob);
        
        // ローカルダウンロード
        const link = document.createElement('a');
        link.href = url;
        link.download = `cheki_${appConfig.deviceId}_${Date.now()}.jpg`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        // 保存確認モーダルに画像を表示
        document.getElementById('savedResultImage').src = url;
        openModal('modal-saved');
      }, 'image/jpeg', 0.92);
    }

    // 保存確認モーダルから「次の撮影へ」進むことでカメラフリーズを完全回避して再起動
    function finishAndResetCamera() {
      closeModal('modal-saved');
      startCamera();
    }

    window.addEventListener('load', startCamera);
  </script>
</body>
</html>
