<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>特典会チェキアプリ</title>
  <style>
    body { text-align: center; background: #111; color: white; font-family: sans-serif; margin: 0; padding: 10px; }
    .screen { display: none; }
    .screen.active { display: block; }
    
    canvas, img { max-width: 90vw; max-height: 65vh; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.6); background: white; object-fit: contain; }
    
    /* チェキ風ファインダー */
    .viewfinder-container {
      position: relative;
      display: inline-block;
      background: white;
      padding: 15px 15px 50px 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      border-radius: 6px;
      margin-top: 10px;
    }
    video {
      width: 100%;
      max-width: 380px;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      background: #000;
      display: block;
    }

    button { padding: 14px 28px; font-size: 16px; margin: 10px; cursor: pointer; border: none; border-radius: 30px; font-weight: bold; }
    .btn-main { background: #ff4081; color: white; }
    .btn-sub { background: #777; color: white; }
    .btn-action-row { margin-top: 15px; }
  </style>
</head>
<body>

  <!-- ================= 画面1: 起動直後・即カメラモード ================= -->
  <div id="screen-capture" class="screen active">
    <div class="viewfinder-container">
      <video id="cameraStream" autoplay playsinline muted></video>
    </div>
    <div>
      <button class="btn-main" onclick="takeSnapshot()">シャッター 📸</button>
    </div>
    <canvas id="hiddenCanvas" style="display:none;"></canvas>
  </div>

  <!-- ================= 画面2: プレビュー確認画面 ================= -->
  <div id="screen-preview" class="screen">
    <h3>👀 プレビュー確認</h3>
    <div>
      <img id="previewImg" alt="プレビュー">
    </div>
    <div class="btn-action-row">
      <button class="btn-sub" onclick="retakePhoto()">🔄 撮り直す</button>
      <button class="btn-main" onclick="confirmPhoto()">✨ これでOK（描画へ）</button>
    </div>
  </div>

  <!-- ================= 画面3: 描画（デコ）画面 ================= -->
  <div id="screen-draw" class="screen">
    <h3>🎨 デコレーション画面</h3>
    <canvas id="chekiCanvas"></canvas>
    <div class="btn-action-row">
      <button class="btn-sub" onclick="retakePhoto()">最初に戻る</button>
    </div>
  </div>

  <script>
    const video = document.getElementById('cameraStream');
    let mediaStream = null;
    let capturedBlob = null;

    function switchScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    // --- 起動と同時にカメラを起動 ---
    async function startCamera() {
      switchScreen('screen-capture');
      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        video.srcObject = mediaStream;
      } catch (err) {
        // 万が一カメラ起動がブロックされた場合の救済（画面どこでもタップで再挑戦）
        console.warn('自動カメラ起動がブロックされました。画面をタップして再試行します。', err);
        document.body.addEventListener('click', retryCameraOnce, { once: true });
      }
    }

    async function retryCameraOnce() {
      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        video.srcObject = mediaStream;
      } catch (e) {
        alert('カメラのアクセスを許可してください。');
      }
    }

    // --- シャッターを切る ---
    function takeSnapshot() {
      const hiddenCanvas = document.getElementById('hiddenCanvas');
      const hCtx = hiddenCanvas.getContext('2d');

      const targetW = 600;
      const targetH = 850;
      hiddenCanvas.width = targetW;
      hiddenCanvas.height = targetH;

      // 白枠
      hCtx.fillStyle = '#ffffff';
      hCtx.fillRect(0, 0, targetW, targetH);

      // 写真エリア (3:4)
      const pX = 40;
      const pY = 40;
      const pW = 520;
      const pH = 693;

      const vW = video.videoWidth;
      const vH = video.videoHeight;
      const vAspect = vW / vH;
      const targetAspect = pW / pH;

      let sx, sy, sW, sH;
      if (vAspect > targetAspect) {
        sH = vH;
        sW = vH * targetAspect;
        sx = (vW - sW) / 2;
        sy = 0;
      } else {
        sW = vW;
        sH = vW / targetAspect;
        sx = 0;
        sy = (vH - sH) / 2;
      }

      hCtx.drawImage(video, sx, sy, sW, sH, pX, pY, pW, pH);

      hiddenCanvas.toBlob(function(blob) {
        capturedBlob = blob;
        const imageUrl = URL.createObjectURL(blob);
        document.getElementById('previewImg').src = imageUrl;

        if (mediaStream) {
          mediaStream.getTracks().forEach(track => track.stop());
        }

        switchScreen('screen-preview');
      }, 'image/jpeg', 0.85);
    }

    function retakePhoto() {
      capturedBlob = null;
      startCamera();
    }

    function confirmPhoto() {
      if (!capturedBlob) return;

      const downloadLink = document.createElement('a');
      const url = URL.createObjectURL(capturedBlob);
      downloadLink.href = url;
      downloadLink.download = `cheki_${Date.now()}.jpg`;
      document.body.appendChild(downloadLink);
      downloadLink.click();
      document.body.removeChild(downloadLink);

      const chekiCanvas = document.getElementById('chekiCanvas');
      const ctx = chekiCanvas.getContext('2d');
      chekiCanvas.width = 600;
      chekiCanvas.height = 850;

      const img = new Image();
      img.onload = function() {
        ctx.drawImage(img, 0, 0);
        switchScreen('screen-draw');
      };
      img.src = url;
    }

    window.addEventListener('load', startCamera);
  </script>
</body>
</html>
