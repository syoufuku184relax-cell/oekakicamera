<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>PWAカメラアプリ</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: sans-serif;
    }

    /* カメラ映像を画面全体に表示（タップシャッターの対象） */
    #camera-preview {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* 撮影結果を表示するCanvas（普段は非表示） */
    #snapshot-canvas {
      display: none;
    }

    /* 画面上のどこでもシャッターが押せることを示すガイド（任意） */
    .tap-guide {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      z-index: 2;
      pointer-events: none; /* タップイベントを邪魔しない */
    }

    /* 自由に動かせるフローティングシャッターボタン */
    #floating-shutter {
      position: absolute;
      bottom: 50px;
      right: 50px;
      width: 70px;
      height: 70px;
      background: rgba(255, 255, 255, 0.8);
      border: 4px solid #fff;
      border-radius: 50%;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      z-index: 3;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none; /* スクロール等のブラウザデフォルト動作を抑制 */
    }

    #floating-shutter::after {
      content: '';
      width: 54px;
      height: 54px;
      background: #fff;
      border-radius: 50%;
      transition: background 0.1s;
    }

    #floating-shutter:active::after {
      background: #ccc;
    }

    /* 撮影完了時のプレビュー表示用オーバーレイ */
    #result-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.9);
      z-index: 10;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #result-overlay img {
      max-width: 90%;
      max-height: 70%;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .close-btn {
      background: #fff;
      color: #000;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- カメラプレビュー（画面全体のタップでシャッターが切れます） -->
  <video id="camera-preview" autoplay playsinline muted></video>

  <div class="tap-guide">画面どこでもタップで撮影可能</div>

  <!-- ドラッグ＆ドロップできるシャッターボタン -->
  <div id="floating-shutter" title="ドラッグして移動できます"></div>

  <!-- 非表示のキャンバス（画像切り出し用） -->
  <canvas id="snapshot-canvas"></canvas>

  <!-- 撮影結果確認画面 -->
  <div id="result-overlay">
    <img id="result-image" alt="Captured Photo">
    <button class="close-btn" id="close-result">もどる</button>
  </div>

  <script>
    const video = document.getElementById('camera-preview');
    const canvas = document.getElementById('snapshot-canvas');
    const shutterBtn = document.getElementById('floating-shutter');
    const resultOverlay = document.getElementById('result-overlay');
    const resultImage = document.getElementById('result-image');
    const closeResultBtn = document.getElementById('close-result');

    // 1. Webカメラ（インカメラ優先）の起動
    async function initCamera() {
      try {
        const constraints = {
          video: {
            facingMode: 'user', // インカメラを優先
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        };
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
      } catch (err) {
        console.error('カメラの起動に失敗しました:', err);
        alert('カメラを利用できません。権限を確認してください。');
      }
    }

    // 2. 共通のシャッター処理（Canvasに描画して静止画を取得）
    function takeSnapshot() {
      const width = video.videoWidth;
      const height = video.videoHeight;
      if (width === 0 || height === 0) return;

      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');

      // インカメラの場合は左右反転して保存したい場合があるため必要に応じて調整
      ctx.translate(width, 0);
      ctx.scale(-1, 1);

      ctx.drawImage(video, 0, 0, width, height);

      // 画像データを取得してプレビュー表示
      const dataUrl = canvas.toDataURL('image/png');
      resultImage.src = dataUrl;
      resultOverlay.style.display = 'flex';
    }

    // A. 「画面のどこをタップしても」シャッターを切る処理
    // ※ ただし、シャッターボタンをドラッグしている最中は誤爆しないように判定を入れる
    let isDragging = false;
    video.addEventListener('click', (e) => {
      if (!isDragging) {
        takeSnapshot();
      }
    });

    // B. 「フローティングシャッターボタン」のドラッグ＆ドロップ移動 ＆ タップ処理
    let startX, startY, initialX, initialY;

    shutterBtn.addEventListener('pointerdown', (e) => {
      isDragging = false;
      startX = e.clientX;
      startY = e.clientY;
      
      const rect = shutterBtn.getBoundingClientRect();
      initialX = rect.left;
      initialY = rect.top;

      shutterBtn.setPointerCapture(e.pointerId);
    });

    shutterBtn.addEventListener('pointermove', (e) => {
      if (e.buttons === 0) return;

      const deltaX = e.clientX - startX;
      const deltaY = e.clientY - startY;

      // 少しでも動いたら「ドラッグ中」とみなす
      if (Math.abs(deltaX) > 5 || Math.abs(deltaY) > 5) {
        isDragging = true;
      }

      if (isDragging) {
        shutterBtn.style.left = `${initialX + deltaX}px`;
        shutterBtn.style.top = `${initialY + deltaY}px`;
        shutterBtn.style.right = 'auto'; // right固定を解除
        shutterBtn.style.bottom = 'auto'; // bottom固定を解除
      }
    });

    shutterBtn.addEventListener('pointerup', (e) => {
      // ドラッグしていなかった（＝単なるタップだった）場合はシャッターを切る
      if (!isDragging) {
        takeSnapshot();
      }
      shutterBtn.releasePointerCapture(e.pointerId);
      isDragging = false;
    });

    // プレビューを閉じる
    closeResultBtn.addEventListener('click', () => {
      resultOverlay.style.display = 'none';
    });

    // アプリ起動時にカメラを呼び出す
    initCamera();
  </script>
</body>
</html>
